llm:
  provider: "api-endpoint"

api-endpoint:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  model: "nvidia/nemotron-3.5-lightning:free"
  max_retries: 3
  sleep_time: 0.5


# Ingest configuration
ingest:
  default_format: "txt"
  youtube_captions: "auto"


# LLM generation parameters
generation:
  temperature: 0.3
  top_p: 0.95

  # Document processing strategy
  processing_strategy: "auto"
  single_call_max_size: 8000

  # Chunking parameters
  chunk_size: 4000
  overlap: 200

  # Model parameters
  max_tokens: 4096

  # Content generation targets
  num_pairs: 25
  num_cot_examples: 5
  num_cot_enhance_examples: null

  # Batch processing
  batch_size: 32

  # Quality settings
  enable_deduplication: true
  similarity_threshold: 0.8


# Content curation parameters
curate:
  threshold: 7.0
  batch_size: 5
  inference_batch: 5
  temperature: 0.1


# Format conversion parameters
format:
  default: "jsonl"
  include_metadata: true
  pretty_json: true


# Prompt templates
prompts:

  summary: |
    Summarize the document in 3-5 concise sentences using only information explicitly stated in the document.

    Cover the main topic, important entities, key facts, and conclusions when present.

    Do not use outside knowledge, assumptions, interpretations, or details that are not supported by the text.

    If the document is incomplete or uncertain about a fact, preserve that uncertainty.

    Return only the summary text.

    Document:
    {text}

  qa_generation: |
    Generate a high-quality question-answer dataset from the provided document.

    The questions and answers should be based primarily on the information
    contained in the document. Use the document as the only source of factual
    information.

    Generate between 5 and 15 useful QA pairs, depending on how much relevant
    information is available in the document.

    Focus on important banking and regulatory information, including:
    - definitions
    - classifications
    - eligibility criteria
    - limits and thresholds
    - dates
    - percentages
    - regulatory requirements
    - procedures
    - policies
    - responsibilities
    - organizations
    - conditions and exceptions
    - lending requirements
    - financial limits
    - important facts and relationships

    Questions should be specific and useful for training a banking-domain
    language model.

    Answers should be concise but sufficiently detailed to answer the question
    completely.

    Use the exact figures, percentages, dates, names, limits and conditions
    given in the document.

    Do not invent facts or introduce unrelated information.

    Avoid generic questions such as "What is this document about?"

    Avoid duplicate or nearly identical questions.

    Create different types of questions where appropriate:
    - What is...
    - What are the limits...
    - What percentage...
    - Which entities...
    - What requirements...
    - How is something classified...
    - What conditions apply...
    - What facilities or provisions are available...

    Do not generate placeholder questions or answers.

    Return ONLY a valid JSON array.
    Each item must have exactly two fields: "question" and "answer".

    SOURCE DOCUMENT:

    {text}


  qa_rating: |
    Evaluate each supplied question-answer pair strictly against the provided source content.

    Scoring criteria (1-10 total):

    - Accuracy (0-4): Every claim in the answer is directly supported by the source text.
    - Relevance (0-2): The question addresses meaningful source content.
    - Clarity (0-2): The question and answer are precise and unambiguous.
    - Usefulness (0-2): The pair is valuable, specific, and non-duplicative for training.

    Rules:

    1. Rate every input pair.

    2. Do not add, remove, rewrite, reorder, or merge pairs.

    3. Use ratings 1-3 for unsupported, hallucinated, contradictory, or unanswerable answers.

    4. Use ratings 4-6 for partially supported, vague, trivial, or weakly phrased pairs.

    5. Use ratings 7-8 for accurate and useful pairs with minor limitations.

    6. Use ratings 9-10 only when the pair is fully grounded, important, clear, specific, and useful.

    7. Preserve the exact original question and answer strings.

    8. Return valid JSON only.

    Source text:
    {text}

    QA pairs to rate:
    {pairs}


  cot_generation: |
    Create evidence-grounded reasoning examples from the provided text for LLM training.

    Requirements:

    1. Generate only questions whose answers can be determined from the provided text.

    2. Prefer questions that require combining two or more explicitly stated facts, comparing stated details, following a stated process, or identifying a stated cause and effect.

    3. Do not use outside knowledge or make unstated assumptions.

    4. The "reasoning" field must contain a short, auditable rationale based only on explicit facts from the source.

    5. Do not invent intermediate facts or unsupported conclusions.

    6. The final answer must be concise and fully supported by the source.

    7. Generate up to 10 strong examples, but return fewer when the source does not support more.

    8. Return an empty array if no safely supported examples can be generated.

    9. Never generate placeholder questions, reasoning, or answers.

    10. Before returning an example, verify that every factual claim in both "reasoning" and "answer" is supported by the source.

    Return valid JSON only, with no Markdown or explanation:

    [
      {{
        "question": "Question requiring synthesis of stated facts?",
        "reasoning": "The text states that [fact 1]. It also states that [fact 2]. Together, these facts support the answer.",
        "answer": "Concise answer."
      }}
    ]

    Text:
    {text}


  cot_enhancement: |
    Enhance the supplied conversations with concise, evidence-grounded rationales only when the conversation itself contains enough information to support them.

    Rules:

    1. Preserve every original message, role, ordering, and original assistant answer exactly.

    2. Do not introduce new factual claims, external knowledge, assumptions, or fabricated reasoning.

    3. Add a rationale only when it can be derived directly from information already present in the conversation.

    4. For complex responses, prepend a brief rationale using explicit facts from the conversation, followed by the unchanged original answer.

    5. {include_simple_steps} controls whether to add the same type of brief rationale to simple responses. If false, leave simple responses unchanged.

    6. If support is missing, ambiguous, or incomplete, leave the assistant response unchanged rather than inventing a rationale.

    7. Return valid JSON only, with no Markdown or explanation.

    Return the enhanced conversations as a JSON array:

    [
      [
        {{"role": "system", "content": "System message"}},
        {{"role": "user", "content": "User question"}},
        {{"role": "assistant", "content": "Rationale: [brief rationale grounded in the conversation]\n\n[unchanged original answer]"}}
      ]
    ]

    Original conversations:
    {conversations}